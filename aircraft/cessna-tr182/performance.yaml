# Cruise at 3,100 lb from POH Section 5, Figure 5-7 (Cruise
# Performance). Conditions: recommended lean mixture, cowl flaps
# closed, standard temperature. Each row is the 2400 RPM / 25" MP
# (full-throttle) entry from that altitude's chart — the highest
# published power setting.
