# Takeoff distance from SR22T POH Section 5. The POH publishes
# tables at 3,400 lb (max gross) and 2,900 lb; both are included so
# the engine reads the next-higher published weight tier for the
# aircraft's actual weight rather than reading off the heaviest
# tier alone. POH values are used verbatim — no scaling, no
# interpolation between cells. Conditions: flaps 50%, full throttle,
# dry/paved/level runway, zero wind.
