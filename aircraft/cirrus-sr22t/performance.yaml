# All cruise rows are from the SR22T POH Section 5 "Cruise Performance"
# table at 3200 lb, ISA standard temperature, 75% power (% of 315 HP).
# The turbo-normalized engine can hold 75% all the way to the 25,000 ft
# certified ceiling.
