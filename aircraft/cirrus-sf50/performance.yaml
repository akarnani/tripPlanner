climb:
  # Max Rate of Climb at 6000 lb gross, sea level, ISA (15 °C),
  # interpolated between the 10 °C (2125 fpm) and 20 °C (1613 fpm)
  # rows of the Enroute Climb table.
  rate_fpm: 1869
  fuel_to_climb_gph: 110
  # Cumulative time/fuel/distance to climb from sea level at 6000 lb
  # gross weight, ISA standard temperature. From AFM "Time, Fuel, &
  # Distance to Climb" chart, ISA / Aircraft Weight: 6000 lb.
