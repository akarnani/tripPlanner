climb:
  # Max Rate of Climb at 6000 lb gross, sea level, 20 °C — the
  # next-higher published cell above standard (ISA = 15 °C). POH
  # values used verbatim.
  rate_fpm: 1613
  fuel_to_climb_gph: 110
  # Cumulative time/fuel/distance to climb from sea level at 6000 lb
  # gross weight, ISA standard temperature. From AFM "Time, Fuel, &
  # Distance to Climb" chart, ISA / Aircraft Weight: 6000 lb.
  table:
    - altitude_ft: 0
      time_min: 0
      fuel_gal: 0.0
      distance_nm: 0
    - altitude_ft: 2000
      time_min: 1
      fuel_gal: 2
      distance_nm: 3
    - altitude_ft: 4000
      time_min: 2
      fuel_gal: 5
      distance_nm: 6
    - altitude_ft: 6000
      time_min: 3
      fuel_gal: 7
      distance_nm: 9
    - altitude_ft: 8000
      time_min: 5
      fuel_gal: 9
      distance_nm: 13
    - altitude_ft: 10000
      time_min: 6
      fuel_gal: 11
      distance_nm: 16
    - altitude_ft: 12000
      time_min: 7
      fuel_gal: 13
      distance_nm: 20
    - altitude_ft: 14000
