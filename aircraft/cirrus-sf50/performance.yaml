make: Cirrus
model: SF50
fuel:
  type: Jet-A
  density_lb_per_gal: 6.7
  usable_capacity_gal: 296
# Cruise rows are taken from the SF50 AFM Section 5 cruise tables at
# 6000 lb gross weight, ISA standard temperature, second-from-top
# power setting (one notch below Maximum Continuous Thrust). %N1 is
# reported as power_pct, which is the conventional published power
# reference for turbofan engines.
