# Landing distance from AFM Section 5, flaps 100%, at the two
# published weight tiers (5,550 lb max landing and 4,500 lb).
# Hotter and higher cells are grayed out in the AFM (failure to
# meet the balked-landing climb gradient), so each tier's engine-
# readable rectangle is the densest fully-populated subset:
#   5,550 lb: 0–20 °C × SL → 9,000 ft
#   4,500 lb: 0–30 °C × SL → 10,000 ft
