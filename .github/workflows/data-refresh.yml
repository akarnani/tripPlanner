name: Refresh static datasets

on:
  schedule:
    # Every Wednesday at 12:00 UTC. FAA NASR / CIFP follow a 28-day
    # cycle, so a weekly cadence catches each cycle within a week of
    # release. Only NASR / CIFP / DOF run on the schedule; the DEM and
    # magnetic-variation jobs are manual.
    - cron: "0 12 * * 3"
  workflow_dispatch:
    inputs:
      cifp_url:
        description: "Override CIFP download URL (leave blank for default)"
        required: false
        type: string
      dof_url:
        description: "Override DOF download URL (leave blank for default)"
        required: false
        type: string

permissions:
  contents: write
  # Lets the notify job open / refresh a tracking issue when a
  # scheduled refresh fails, so failures surface beyond the Actions tab.
  issues: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  pipelines:
    # Single macOS job that compiles the SwiftPM graph once and runs
    # NASR / CIFP / DOF in sequence. Compared to three parallel jobs,
    # this avoids paying the SwiftSyntax-macro-plugin build cost three
    # times on every dispatch.
    #
    # Per-pipeline isolation is preserved at the commit level: each
    # download/run/commit step uses continue-on-error and the commit
    # is gated on the prior run actually succeeding. So a failed CIFP
    # download still lets NASR commit, DOF still runs, etc.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Select latest Xcode (Swift 6.2 for SwiftCIFP/DOF)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # ---- Shared SwiftPM cache ----
      # With deps pinned by revision SHA in Package.swift, this key is
      # stable across upstream pushes. The global package cache picks
      # up source checkouts so resolve is instant on hits too.
      - name: Cache SwiftPM .build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pipelines/swift/.build
          key: swift-build-${{ runner.os }}-${{ hashFiles('pipelines/swift/Package.swift') }}
          restore-keys: |
            swift-build-${{ runner.os }}-
      - name: Cache SwiftPM package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-cache-${{ runner.os }}-${{ hashFiles('pipelines/swift/Package.swift') }}
          restore-keys: |
            swiftpm-cache-${{ runner.os }}-

      - name: Build all pipeline executables
        working-directory: pipelines/swift
        run: swift build -c release

      # ---- NASR ----
      - name: Run NASR pipeline
        id: run_nasr
        continue-on-error: true
        working-directory: pipelines/swift
        run: |
          set -euo pipefail
          swift run -c release pipeline-nasr ./nasr-distribution.zip ../../data
          # Guard against a "succeeded but wrote garbage" outcome — a
          # 0-exit run that emits an empty or implausibly short file
          # would otherwise commit nothing and look healthy forever.
          # CONUS has ~5k public-use airports; anything under 3,000 means
          # the FAA layout changed or the parse silently dropped records.
          python3 "$GITHUB_WORKSPACE/.github/scripts/check_counts.py" \
            "$GITHUB_WORKSPACE/data/airports.json:3000" \
            "$GITHUB_WORKSPACE/data/runways.json:3000"
      - name: Commit refreshed NASR data
        id: commit_nasr
        if: steps.run_nasr.outcome == 'success'
        run: |
          if [[ -z "$(git status --porcelain data/airports.json data/runways.json)" ]]; then
            echo "No NASR changes."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/airports.json data/runways.json
          git commit -m "Refresh NASR airports + runways"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ---- CIFP ----
      - name: Download CIFP
        id: download_cifp
        continue-on-error: true
        working-directory: pipelines/swift
        env:
          CIFP_URL: ${{ inputs.cifp_url }}
        run: |
          set -euo pipefail
          if [[ -n "${CIFP_URL:-}" ]]; then
            urls=("$CIFP_URL")
          else
            # FAA CIFP zips are published per TPP effective date on a
            # 56-day cycle, named CIFP_YYMMDD.zip. Generate cycle dates
            # around today from a known anchor and try newest-first.
            urls=()
            while IFS= read -r ymd; do
              urls+=("https://aeronav.faa.gov/Upload_313-d/cifp/CIFP_${ymd}.zip")
            done < <(python3 - <<'PY'
          from datetime import date, timedelta
          anchor = date(2026, 5, 14)
          today = date.today()
          base = (today - anchor).days // 56
          for o in (base, base - 1, base + 1, base - 2):
              print((anchor + timedelta(days=o * 56)).strftime('%y%m%d'))
          PY
                          )
          fi
          for u in "${urls[@]}"; do
            echo "trying $u"
            if curl -sLfo CIFP.zip "$u"; then
              echo "downloaded $u"; break
            fi
          done
          if [[ ! -s CIFP.zip ]]; then
            echo "::error::no CIFP URL succeeded; pass cifp_url via workflow_dispatch"
            exit 1
          fi
          unzip -o CIFP.zip FAACIFP18
      - name: Run CIFP pipeline
        id: run_cifp
        if: steps.download_cifp.outcome == 'success'
        continue-on-error: true
        working-directory: pipelines/swift
        run: |
          set -euo pipefail
          swift run -c release pipeline-cifp ./FAACIFP18 ../../data
          # ~5k airports carry at least one instrument approach; a parse
          # that drops to near-zero means the CIFP format shifted.
          python3 "$GITHUB_WORKSPACE/.github/scripts/check_counts.py" \
            "$GITHUB_WORKSPACE/data/approaches.json:1000"
      - name: Commit refreshed CIFP data
        id: commit_cifp
        if: steps.run_cifp.outcome == 'success'
        run: |
          if [[ -z "$(git status --porcelain data/approaches.json)" ]]; then
            echo "No CIFP changes."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/approaches.json
          git commit -m "Refresh CIFP approaches"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # ---- DOF ----
      - name: Download DOF
        id: download_dof
        continue-on-error: true
        working-directory: pipelines/swift
        env:
          DOF_URL: ${{ inputs.dof_url }}
        run: |
          set -euo pipefail
          if [[ -n "${DOF_URL:-}" ]]; then
            urls=("$DOF_URL")
          else
            # FAA DOF zips are published per cycle as DOF_YYMMDD.zip
            # on a 56-day schedule (DAILY_DOF.ZIP no longer exists).
            urls=()
            while IFS= read -r ymd; do
              urls+=("https://aeronav.faa.gov/Obst_Data/DOF_${ymd}.zip")
            done < <(python3 - <<'PY'
          from datetime import date, timedelta
          anchor = date(2026, 4, 12)
          today = date.today()
          base = (today - anchor).days // 56
          for o in (base, base - 1, base + 1, base - 2):
              print((anchor + timedelta(days=o * 56)).strftime('%y%m%d'))
          PY
                          )
          fi
          for u in "${urls[@]}"; do
            echo "trying $u"
            if curl -sLfo DOF.zip "$u"; then
              echo "downloaded $u"; break
            fi
          done
          if [[ ! -s DOF.zip ]]; then
            echo "::error::no DOF URL succeeded; pass dof_url via workflow_dispatch"
            exit 1
          fi
          unzip -o DOF.zip
          dof_file=$(find . -maxdepth 2 -iname "DOF.DAT" | head -1)
          if [[ -z "$dof_file" ]]; then
            echo "::error::no DOF.DAT found inside the zip"
            ls -la; exit 1
          fi
          mv "$dof_file" DOF.DAT
      - name: Run DOF pipeline
        id: run_dof
        if: steps.download_dof.outcome == 'success'
        continue-on-error: true
        working-directory: pipelines/swift
        run: |
          set -euo pipefail
          swift run -c release pipeline-dof ./DOF.DAT ../../data
          # CONUS DOF carries ~200k obstacles ≥200 ft AGL; well under
          # 50k means the .DAT layout changed or most records were
          # dropped. Validated before the gzip step replaces the file.
          python3 "$GITHUB_WORKSPACE/.github/scripts/check_counts.py" \
            "$GITHUB_WORKSPACE/data/obstacles.json:50000"
      - name: Gzip obstacles.json
        # The runtime loader fetches data/obstacles.json.gz and
        # decompresses in-browser; the committed file is the .gz so
        # Cloudflare Pages' 25 MiB asset cap isn't an issue. gzip -9 -f
        # replaces obstacles.json with obstacles.json.gz in place.
        if: steps.run_dof.outcome == 'success'
        run: |
          if [[ -f data/obstacles.json ]]; then
            gzip -9 -f data/obstacles.json
          fi
      - name: Commit refreshed DOF data
        id: commit_dof
        if: steps.run_dof.outcome == 'success'
        run: |
          if [[ -z "$(git status --porcelain data/obstacles.json.gz)" ]]; then
            echo "No DOF changes."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/obstacles.json.gz
          git commit -m "Refresh DOF obstacles"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Surface per-pipeline outcomes as a Markdown table on the run
      # page (the Step Summary renders prominently, so you no longer
      # have to grep logs to see what each pipeline did), and fail the
      # job if any individual pipeline failed — so the run shows red,
      # even though continue-on-error muted each step on its own.
      - name: Report per-pipeline status
        if: always()
        env:
          NASR_RUN: ${{ steps.run_nasr.outcome }}
          NASR_COMMIT: ${{ steps.commit_nasr.outputs.committed }}
          CIFP_DL: ${{ steps.download_cifp.outcome }}
          CIFP_RUN: ${{ steps.run_cifp.outcome }}
          CIFP_COMMIT: ${{ steps.commit_cifp.outputs.committed }}
          DOF_DL: ${{ steps.download_dof.outcome }}
          DOF_RUN: ${{ steps.run_dof.outcome }}
          DOF_COMMIT: ${{ steps.commit_dof.outputs.committed }}
        run: |
          # Render one row per pipeline: ✅/❌ for the run, and whether
          # it pushed a commit ("updated") or found no upstream change.
          fmt() { # outcome -> emoji
            case "$1" in
              success) echo "✅ ok" ;;
              failure) echo "❌ failed" ;;
              skipped|"") echo "⚪ skipped" ;;
              *) echo "$1" ;;
            esac
          }
          committed() { # committed-output -> human label
            case "$1" in
              true) echo "📦 committed new data" ;;
              false) echo "— no change" ;;
              *) echo "—" ;;
            esac
          }
          {
            echo "## Data refresh"
            echo ""
            echo "| Pipeline | Download | Build | Result |"
            echo "| --- | --- | --- | --- |"
            echo "| NASR (airports/runways) | n/a | $(fmt "$NASR_RUN") | $(committed "$NASR_COMMIT") |"
            echo "| CIFP (approaches) | $(fmt "$CIFP_DL") | $(fmt "$CIFP_RUN") | $(committed "$CIFP_COMMIT") |"
            echo "| DOF (obstacles) | $(fmt "$DOF_DL") | $(fmt "$DOF_RUN") | $(committed "$DOF_COMMIT") |"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for o in "$NASR_RUN" "$CIFP_DL" "$CIFP_RUN" "$DOF_DL" "$DOF_RUN"; do
            [[ "$o" == "failure" ]] && fail=1
          done
          if [[ $fail -ne 0 ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ One or more pipelines failed — see the table above." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $fail

  dem:
    # Terrain doesn't change month-to-month; refresh manually to pick
    # up source-data revisions.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - run: python pipelines/dem_build.py data
      - name: Commit refreshed DEM
        run: |
          if [[ -z "$(git status --porcelain data/terrain_grid.bin.gz)" ]]; then
            echo "No DEM changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/terrain_grid.bin.gz
          git commit -m "Refresh CONUS terrain DEM grid"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin HEAD:"$GITHUB_REF_NAME"

  notify:
    # Escalate a failed refresh beyond the Actions tab: open a tracking
    # issue (or comment on the existing open one) so the failure pings
    # watchers and stays visible until someone fixes it. Reuses a single
    # issue rather than spamming a new one each week.
    needs: [pipelines, magnetic]
    if: always() && (needs.pipelines.result == 'failure' || needs.magnetic.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const MARKER = "[data-refresh failure]";
            const failed = [];
            if (${{ needs.pipelines.result == 'failure' }}) failed.push("NASR / CIFP / DOF pipelines");
            if (${{ needs.magnetic.result == 'failure' }}) failed.push("magnetic-variation grid");

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const when = new Date().toISOString().slice(0, 10);
            const body = [
              `A scheduled data refresh failed on **${when}**.`,
              ``,
              `**Failed:** ${failed.join(", ")}`,
              ``,
              `See the [run summary](${runUrl}) for the per-pipeline table,`,
              `then drill into the failing step's logs. Common causes: the FAA`,
              `rotated a download URL (pass an override via workflow_dispatch),`,
              `or a source-format change tripped the record-count sanity check.`,
              ``,
              `_Posted automatically by the data-refresh workflow._`,
            ].join("\n");

            // Find an existing open issue we previously opened, by marker
            // in the title, so failures coalesce into one thread.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              creator: "github-actions[bot]",
              per_page: 100,
            });
            const hit = existing.data.find(
              (i) => !i.pull_request && i.title.includes(MARKER),
            );

            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${MARKER} scheduled dataset refresh failing`,
                body,
              });
            }

  magnetic:
    # WMM drifts slowly; rebuild monthly so the committed grid never
    # lags by more than ~0.1°.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install numpy pygeomag
      - run: python pipelines/magnetic_build.py data
      - name: Commit refreshed magnetic grid
        run: |
          if [[ -z "$(git status --porcelain data/magnetic_grid.bin.gz)" ]]; then
            echo "No magnetic-grid changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/magnetic_grid.bin.gz
          git commit -m "Refresh CONUS magnetic variation grid"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
