name: Refresh static datasets

on:
  schedule:
    # Every Wednesday at 12:00 UTC. FAA NASR/CIFP follow a 28-day cycle,
    # so a weekly cadence catches each cycle within a week of release.
    - cron: "0 12 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: pipelines/swift/.build
          key: swift-build-${{ runner.os }}-${{ hashFiles('pipelines/swift/Package.swift', 'pipelines/swift/Package.resolved') }}
          restore-keys: |
            swift-build-${{ runner.os }}-

      - name: Build pipelines
        working-directory: pipelines/swift
        run: swift build -c release

      - name: Run NASR pipeline
        working-directory: pipelines/swift
        run: swift run -c release pipeline-nasr ./nasr-distribution.zip ../../data

      - name: Download CIFP
        working-directory: pipelines/swift
        run: |
          if [[ ! -f FAACIFP18 ]]; then
            curl -sLfO https://aeronav.faa.gov/Upload_313-d/cifp/CIFP_$(date -u +%y%m).zip || \
              curl -sLfO https://aeronav.faa.gov/Upload_313-d/cifp/CIFP_$(date -u -v-28d +%y%m).zip
            unzip -o CIFP_*.zip FAACIFP18
          fi

      - name: Run CIFP pipeline
        working-directory: pipelines/swift
        run: swift run -c release pipeline-cifp ./FAACIFP18 ../../data

      - name: Download DOF
        working-directory: pipelines/swift
        run: |
          if [[ ! -f DOF.DAT ]]; then
            curl -sLfO https://aeronav.faa.gov/Obst_Data/DAILY_DOF.ZIP
            unzip -o DAILY_DOF.ZIP DOF.DAT
          fi

      - name: Run DOF pipeline
        working-directory: pipelines/swift
        run: swift run -c release pipeline-dof ./DOF.DAT ../../data

      - name: Commit refreshed data
        run: |
          if [[ -z "$(git status --porcelain data)" ]]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/airports.json data/runways.json data/approaches.json data/obstacles.json
          git commit -m "Refresh NASR / CIFP / DOF datasets"
          git push
