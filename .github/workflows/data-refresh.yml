name: Refresh static datasets

on:
  schedule:
    # Every Wednesday at 12:00 UTC. FAA NASR/CIFP follow a 28-day cycle,
    # so a weekly cadence catches each cycle within a week of release.
    - cron: "0 12 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: pipelines/swift/.build
          key: swift-build-${{ runner.os }}-${{ hashFiles('pipelines/swift/Package.swift', 'pipelines/swift/Package.resolved') }}
          restore-keys: |
            swift-build-${{ runner.os }}-

      - name: Build pipelines
        working-directory: pipelines/swift
        run: swift build -c release

      - name: Run NASR pipeline
        working-directory: pipelines/swift
        run: swift run -c release pipeline-nasr ./nasr-distribution.zip ../../data

      - name: Download CIFP
        working-directory: pipelines/swift
        run: |
          if [[ ! -f FAACIFP18 ]]; then
            curl -sLfO https://aeronav.faa.gov/Upload_313-d/cifp/CIFP_$(date -u +%y%m).zip || \
              curl -sLfO https://aeronav.faa.gov/Upload_313-d/cifp/CIFP_$(date -u -v-28d +%y%m).zip
            unzip -o CIFP_*.zip FAACIFP18
          fi

      - name: Run CIFP pipeline
        working-directory: pipelines/swift
        run: swift run -c release pipeline-cifp ./FAACIFP18 ../../data

      - name: Download DOF
        working-directory: pipelines/swift
        run: |
          if [[ ! -f DOF.DAT ]]; then
            curl -sLfO https://aeronav.faa.gov/Obst_Data/DAILY_DOF.ZIP
            unzip -o DAILY_DOF.ZIP DOF.DAT
          fi

      - name: Run DOF pipeline
        working-directory: pipelines/swift
        run: swift run -c release pipeline-dof ./DOF.DAT ../../data

      - name: Commit refreshed data
        run: |
          if [[ -z "$(git status --porcelain data)" ]]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/airports.json data/runways.json data/approaches.json data/obstacles.json
          git commit -m "Refresh NASR / CIFP / DOF datasets"
          git push

  dem:
    # Terrain doesn't change month-to-month; refresh annually to pick up
    # source data revisions. Triggered manually or via the same workflow_dispatch.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - run: python pipelines/dem_build.py data
      - name: Commit refreshed DEM
        run: |
          if [[ -z "$(git status --porcelain data/terrain_grid.bin.gz)" ]]; then
            echo "No DEM changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/terrain_grid.bin.gz
          git commit -m "Refresh CONUS terrain DEM grid"
          git push

  magnetic:
    # Magnetic variation drifts slowly; WMM coefficients refresh every
    # five years. Rebuild monthly so the committed grid never lags by
    # more than ~0.1°.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pygeomag
      - run: python pipelines/magnetic_build.py data
      - name: Commit refreshed magnetic grid
        run: |
          if [[ -z "$(git status --porcelain data/magnetic_grid.bin.gz)" ]]; then
            echo "No magnetic-grid changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/magnetic_grid.bin.gz
          git commit -m "Refresh CONUS magnetic variation grid"
          git push
