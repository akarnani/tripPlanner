name: E2E (Playwright)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    # Pinned: ubuntu-latest moved to Ubuntu 26.04 in Oct 2026, and
    # Playwright 1.60 can't install Chromium's system deps there
    # ("Playwright does not support chromium on ubuntu26.04-x64").
    # Move back to ubuntu-latest once a Playwright release supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
