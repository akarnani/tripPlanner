name: Validate aircraft performance YAML

on:
  pull_request:
    paths:
      - "aircraft/**"
      - "pipelines/validate_perf.mjs"
  push:
    branches: [main]
    paths:
      - "aircraft/**"
      - "pipelines/validate_perf.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: node pipelines/validate_perf.mjs
